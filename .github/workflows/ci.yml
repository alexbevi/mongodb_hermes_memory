name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v --cov=hermes_mongodb_memory --cov-report=term-missing

  integration:
    name: Integration tests (real MongoDB)
    runs-on: ubuntu-latest
    needs: unit
    services:
      mongo:
        image: mongo:7-jammy
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration suite
        env:
          # Standalone Mongo is enough for everything in test_integration.py;
          # rs0/replset is only needed for change streams (future).
          MONGODB_TEST_URI: mongodb://localhost:27017
        run: pytest tests/test_integration.py -v -m integration

  hermes-conformance:
    name: Hermes conformance (real ABC + loader)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plugin + hermes-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,hermes]"

      - name: Run conformance suite
        run: pytest tests/test_hermes_conformance.py -v -m hermes
