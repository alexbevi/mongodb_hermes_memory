services:
  mongo:
    image: mongo:7-jammy
    container_name: hermes-mongodb-memory-test
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (_) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
